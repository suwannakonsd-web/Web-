<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบยืม-คืนหนังสือ</title>
  <style>
    :root {
      --phi: 1.618;
      --s0: 0.382rem;
      --s1: 0.618rem;
      --s2: 1rem;
      --s3: 1.618rem;
      --s4: 2.618rem;
      --border-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: var(--s2);
      line-height: var(--phi);
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--s3);
    }

    /* กล่องการ์ดฟอร์มตรงกลาง (สัดส่วน Golden Ratio) */
    main {
      width: 100%;
      max-width: 26.18rem; /* 420px อิงตาม Golden Ratio Scale */
      border: 1px solid var(--border-color);
      padding: var(--s4) var(--s3);
      background-color: #ffffff;
    }

    header {
      margin-bottom: var(--s3);
      padding-bottom: var(--s1);
      border-bottom: 1px solid var(--border-color);
    }

    header small {
      display: block;
      font-size: 0.75rem;
      color: #333333;
      margin-bottom: var(--s0);
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .form-group {
      margin-bottom: var(--s2);
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: var(--s0);
    }

    input[type="text"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      font-size: var(--s2);
      padding: var(--s1) var(--s2);
      border: 1px solid var(--border-color);
      border-radius: 0;
      outline: none;
      background: #ffffff;
      transition: background-color 0.2s;
    }

    input:focus {
      background-color: #fafafa;
    }

    button.btn-primary {
      width: 100%;
      font-size: var(--s2);
      font-weight: 600;
      padding: var(--s1) var(--s2);
      margin-top: var(--s2);
      cursor: pointer;
      background-color: #f0f0f0;
      border: 1px solid var(--border-color);
      color: #000000;
      transition: background-color 0.15s ease;
    }

    button.btn-primary:hover {
      background-color: #e4e4e4;
    }

    footer {
      margin-top: var(--s3);
      padding-top: var(--s2);
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    footer p {
      font-size: 0.9rem;
      margin-bottom: var(--s1);
      color: #333333;
    }

    .btn-link {
      display: block;
      width: 100%;
      padding: var(--s1) var(--s2);
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: #000000;
      font-weight: 600;
      font-size: 0.95rem;
      background: #ffffff;
      transition: background-color 0.15s ease;
    }

    .btn-link:hover {
      background-color: #f7f7f7;
    }
  </style>
</head>
<body>

  <!-- กล่องเข้าสู่ระบบ (ตรงกับภาพอ้างอิง) -->
  <main id="login-box">
    <header>
      <small>ระบบยืม-คืนหนังสือ</small>
      <h1>ยินดีต้อนรับ</h1>
    </header>

    <form action="dashboard.html" method="POST">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ - อีเมล</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="ระบุชื่อผู้ใช้หรืออีเมล" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="ระบุรหัสผ่าน" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
    </form>

    <footer>
      <p>ยังไม่มีบัญชีผู้ใช้งาน?</p>
      <a href="#signup-box" class="btn-link" onclick="toggleForm('signup'); return false;">
        สมัครสมาชิก (Sign Up)
      </a>
    </footer>
  </main>

  <!-- กล่องสมัครสมาชิก (ซ่อนไว้ สลับไปมาได้) -->
  <main id="signup-box" style="display: none;">
    <header>
      <small>ระบบยืม-คืนหนังสือ</small>
      <h1>สร้างบัญชีใหม่</h1>
    </header>

    <form action="dashboard.html" method="POST">
      <div class="form-group">
        <label for="new-fullname">ชื่อ - นามสกุล</label>
        <input 
          type="text" 
          id="new-fullname" 
          name="fullname" 
          placeholder="ระบุชื่อและนามสกุล" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="new-email">อีเมล</label>
        <input 
          type="text" 
          id="new-email" 
          name="email" 
          placeholder="example@email.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="new-phone">เบอร์โทรศัพท์</label>
        <input 
          type="tel" 
          id="new-phone" 
          name="phone" 
          placeholder="08X-XXX-XXXX" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="new-password">รหัสผ่าน</label>
        <input 
          type="password" 
          id="new-password" 
          name="password" 
          placeholder="ตั้งรหัสผ่าน" 
          required 
        />
      </div>

      <button type="submit" class="btn-primary">สมัครสมาชิก</button>
    </form>

    <footer>
      <p>มีบัญชีผู้ใช้งานอยู่แล้ว?</p>
      <a href="#login-box" class="btn-link" onclick="toggleForm('login'); return false;">
        เข้าสู่ระบบ (Log In)
      </a>
    </footer>
  </main>

  <script>
    function toggleForm(view) {
      const loginBox = document.getElementById('login-box');
      const signupBox = document.getElementById('signup-box');

      if (view === 'signup') {
        loginBox.style.display = 'none';
        signupBox.style.display = 'block';
      } else {
        signupBox.style.display = 'none';
        loginBox.style.display = 'block';
      }
    }
  </script>

</body>
</html>
