<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างบัญชีใหม่ - ระบบยืม-คืนหนังสือ (Original HTML)</title>
  <style>
    :root { --phi: 1.618; --s0: 0.382rem; --s1: 0.618rem; --s2: 1rem; --s3: 1.618rem; --s4: 2.618rem; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; font-size: var(--s2); line-height: var(--phi); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: var(--s3); background: #fff; }
    main { width: 100%; max-width: 26.18rem; border: 1px solid #000; padding: var(--s4); }
    header { margin-bottom: var(--s3); padding-bottom: var(--s1); border-bottom: 1px solid #000; }
    h1 { font-size: var(--s3); }
    .form-group { margin-bottom: var(--s2); }
    label { display: block; font-weight: bold; margin-bottom: var(--s0); }
    input { width: 100%; font-size: var(--s2); padding: var(--s1) var(--s2); border: 1px solid #000; }
    button { width: 100%; font-size: var(--s2); font-weight: bold; padding: var(--s1) var(--s2); margin-top: var(--s2); cursor: pointer; background: #f0f0f0; border: 1px solid #000; }
    footer { margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid #000; text-align: center; }
    .btn-link { display: block; width: 100%; margin-top: var(--s1); padding: var(--s1) var(--s2); border: 1px solid #000; text-decoration: none; color: #000; font-weight: bold; background: #fff; text-align: center; }
  </style>
</head>
<body>

  <!-- หน้าสมัครสมาชิก (Sign Up) แสดงผลเป็นค่าเริ่มต้น -->
  <main id="signup-box">
    <header>
      <small>ระบบยืม-คืนหนังสือ</small>
      <h1>สร้างบัญชีใหม่</h1>
    </header>
    <form action="dashboard.html" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label>ชื่อ - นามสกุล</label>
        <input type="text" placeholder="ระบุชื่อและนามสกุล" required>
      </div>
      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" placeholder="08X-XXX-XXXX" required>
      </div>
      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" placeholder="ตั้งรหัสผ่าน" required>
      </div>
      <button type="submit">สมัครสมาชิก</button>
    </form>
    <footer>
      <p>มีบัญชีผู้ใช้งานอยู่แล้ว?</p>
      <a href="login.html" class="btn-link">เข้าสู่ระบบ (Log In)</a>
    </footer>
  </main>

</body>
</html>
